# Keeps LG Developer Mode alive so sideloaded Moonlight isn't deleted.
# The session lives on LG's servers, so this works while the TV and laptop are off.
# Secret LG_DEVMODE_TOKEN = contents of /var/luna/preferences/devmode_enabled on the TV.
name: Renew LG Developer Mode

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset Developer Mode session
        env:
          TOKEN: ${{ secrets.LG_DEVMODE_TOKEN }}
        run: |
          resp=$(curl -fsS --retry 3 --retry-delay 10 \
            "https://developer.lge.com/secure/ResetDevModeSession.dev?sessionToken=$TOKEN")
          echo "$resp"
          echo "$resp" | grep -q '"result":"success"'
